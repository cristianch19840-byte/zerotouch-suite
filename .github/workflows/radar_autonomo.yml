name: Radar Zero-Touch v5

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Restaurar base de datos de vistos
        uses: actions/cache@v4
        with:
          path: estado_radar_v4.db
          key: radar-db-${{ github.run_id }}
          restore-keys: |
            radar-db-

      - name: Ejecutar Radar Zero-Touch
        env:
          GEMINI_API_KEY_FREE: ${{ secrets.GEMINI_API_KEY_FREE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python modulo_a_radar_whop/motor_zerotouch_v4.py
